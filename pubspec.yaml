name: agritrack
description: Department of Agriculture – SAAD Monitoring Application (CALABARZON)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Fonts (Bebas Neue + Poppins — no manual download needed) ────
  google_fonts: ^6.2.1

  # ── Offline storage ─────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # ── Connectivity (offline banner) ───────────────────────────────
  connectivity_plus: ^5.0.2

  # ── Navigation ──────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Utilities ───────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ── Assets ──────────────────────────────────────────────────────
  # Fonts loaded via google_fonts — no local font files needed.
  assets:
    - assets/images/splash_bg.png
    - assets/images/auth_bg.png
    - assets/images/da_logo.png